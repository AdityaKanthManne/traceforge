[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "traceforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
traceforge = "traceforge.core:main"
[tool.setuptools.packages.find]
where = ["src"]
